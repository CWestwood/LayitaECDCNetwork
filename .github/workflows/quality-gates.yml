name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: layita-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: layita-app/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Kobo and webhook fixtures
        working-directory: .
        run: |
          node supabase/functions/tests/kobo-payload.fixture-test.cjs
          node supabase/functions/tests/webhook-auth.fixture-test.cjs
          node supabase/functions/tests/process-payload.fixture-test.cjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        working-directory: .
        run: |
          deno check supabase/functions/kobo-fetch/index.ts
          deno check supabase/functions/reprocess-kobo/index.ts
          deno check supabase/functions/admin-users/index.ts

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated local Supabase and apply migrations
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Lint database
        run: supabase db lint --local --level warning
      - name: Run database contracts
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          for contract in supabase/tests/database/*.sql; do
            psql "$PGURL" --set=ON_ERROR_STOP=1 --file="$contract"
          done
